# Local TEST WhatsApp via Evolution API. InviteFlow API stays on 8080; this stack is 8081.
# Image pin: evoapicloud/evolution-api:v2.3.7 — v2.2.3 never emits a QR on current WhatsApp Web
services:
  api:
    container_name: inviteflow_evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net

  redis:
    image: redis:7-alpine
    container_name: inviteflow_evolution_redis
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    container_name: inviteflow_evolution_postgres
    image: postgres:15
    command: ["postgres", "-c", "max_connections=200"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:

networks:
  evolution-net:
    name: inviteflow-evolution-net
