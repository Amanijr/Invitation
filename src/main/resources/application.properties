spring.application.name=InvitationSystem
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/invitation_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${SPRING_MAIL_USERNAME:your-email@gmail.com}}
spring.mail.password=${SMTP_PASSWORD:${SPRING_MAIL_PASSWORD:your-app-password}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:${SPRING_MAIL_FROM:noreply@invitationsystem.com}}
mail.from.name=${MAIL_FROM_NAME:InviteFlow}

# SMS Provider Configuration (twilio | android_smsgate | mock_test)
delivery.sms.provider=${SMS_PROVIDER_MODE:twilio}
delivery.sms.twilio.account-sid=${SMS_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:AC_test_account_sid_placeholder}}
delivery.sms.twilio.auth-token=${SMS_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:test_auth_token_placeholder}}
delivery.sms.twilio.from-number=${SMS_FROM_NUMBER:${TWILIO_FROM_NUMBER:+15005550006}}
delivery.sms.api-url=${SMS_API_URL:https://api.twilio.com/2010-04-01/Accounts}
delivery.sms.android.base-url=${SMS_GATE_BASE_URL:https://api.sms-gate.app}
delivery.sms.android.username=${SMS_GATE_USERNAME:}
delivery.sms.android.password=${SMS_GATE_PASSWORD:}
delivery.sms.android.device-id=${SMS_GATE_DEVICE_ID:}
delivery.sms.android.webhook-secret=${SMS_GATE_WEBHOOK_SECRET:}

# WhatsApp Provider Configuration (meta | evolution | mock_test)
# Evolution TEST only: Docker image evoapicloud/evolution-api:v2.3.7 — POST /message/sendText/{instance}
delivery.whatsapp.provider=${WHATSAPP_PROVIDER_MODE:meta}
delivery.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v18.0/me/messages}
delivery.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:test_access_token_placeholder}
delivery.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:100000000000000}
delivery.whatsapp.from-number=${WHATSAPP_FROM_NUMBER:+15005550006}
delivery.whatsapp.evolution.base-url=${EVOLUTION_BASE_URL:http://127.0.0.1:8081}
delivery.whatsapp.evolution.instance=${EVOLUTION_INSTANCE:}
delivery.whatsapp.evolution.api-key=${EVOLUTION_API_KEY:}
delivery.whatsapp.evolution.webhook-secret=${EVOLUTION_WEBHOOK_SECRET:}

# Application Configuration
app.base-url=http://localhost:8080
# Guest-facing InviteFlow (card view). QR scan URLs stay on app.base-url.
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
server.port=8080

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.InvitationSystem.InvitationSystem.controller
springdoc.paths-to-match=/api/v1/**

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security — set JWT_SECRET in the environment for anything other than local dev
jwt.secret=${JWT_SECRET:dGVzdC1sb2NhbC1qd3Qtc2VjcmV0LTMyYnl0ZXMhISE=}
jwt.expiration-ms=86400000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration